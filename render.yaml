services:
  - type: web
    name: frontieratlas-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///data/frontier_atlas.db
      - key: CORS_ORIGINS
        value: "https://frontieratlas-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
