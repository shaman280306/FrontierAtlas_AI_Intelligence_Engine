version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontieratlas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/frontier_atlas.db
      - CORS_ORIGINS=*

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontieratlas_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
